# Conda environment for ADOPT2g
# Usage: conda env create -f environment.yml && conda activate adopt2g
name: adopt2g
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
    # Install adopt2g with dev and train extras in editable mode, with versions within the ranges
    # in pyproject.toml. For the exact tested versions, use `uv sync --locked` instead.
    - -e .[dev,train]
