# Conda environment for ADOPT2g
# Usage: conda env create -f environment.yml && conda activate adopt2g
name: adopt2g
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
    # PyTorch with CUDA 13.0 support for DGX Spark
    - --index-url https://download.pytorch.org/whl/cu130
    - torch
    - torchvision
    # Install adopt2g with dev and train extras in editable mode
    - -e .[dev,train]
