# Conda environment for ADOPT2g
# Usage: conda env create -f environment.yml && conda activate adopt2g
name: adopt2g
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
    # Install adopt2g with dev and train extras in editable mode; torch comes from PyPI
    - -e .[dev,train]
