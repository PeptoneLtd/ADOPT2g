[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "adopt2g"
version = "0.1.0"
description = "ADOPT 2g: Disorder predictor based on ESM embeddings and TriZOD G-scores"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Michele Invernizzi", email = "michele@peptone.io" },
]

dependencies = [
    "torch",
    "numpy",
    "pandas",
    "scipy",
    "tqdm",
    "transformers",
    "sentence-transformers",
]

[project.optional-dependencies]
train = [
    "wandb",
]
dev = [
    "jupyterlab",
    "matplotlib",
    "ipykernel",
    "black",
    "ruff",
]
attn = [
    "flash-attn",
]

[project.scripts]
adopt2g-predict = "adopt2g.scripts.predict:main"
adopt2g-train = "adopt2g.scripts.run_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["adopt2g*"]

[tool.black]
line-length = 100
target-version = [
    "py310",
    "py311",
    "py312",
]

[tool.ruff]
line-length = 100
select = [
    "E",
    "F",
    "W",
    "I",
]
ignore = [
    "E501",
]
